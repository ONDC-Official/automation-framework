get:
  operationId: getHealth
  summary: Health check
  description: Returns service liveness. Does not require authentication.
  tags: [System]
  security: []
  parameters:
    - $ref: ../components/parameters/RequestId.yaml
  responses:
    '200':
      description: Service is healthy.
      headers:
        X-Request-Id:
          $ref: ../components/headers/RequestId.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Health.yaml
          example:
            status: ok
            timestamp: '2026-10-21T10:15:30Z'
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
