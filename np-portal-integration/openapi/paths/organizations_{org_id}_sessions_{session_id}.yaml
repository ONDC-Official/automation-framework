get:
  operationId: getOrganizationSession
  summary: Get a session
  description: |
    Returns the full data of one session: everything in the list item, plus results
    per flow (with transaction IDs), current settings and the last 10 settings changes.

    Returns `404` if the session does not exist or does not belong to the organization.
    To get titles, descriptions and steps of the session's flows, call
    `GET /flows?session_id={session_id}`.
  tags: [Sessions]
  parameters:
    - $ref: ../components/parameters/OrgId.yaml
    - $ref: ../components/parameters/SessionId.yaml
    - $ref: ../components/parameters/RequestId.yaml
  responses:
    '200':
      description: The session.
      headers:
        X-Request-Id:
          $ref: ../components/headers/RequestId.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SessionDetail.yaml
          example:
            session_id: sess_9b2f4e1a7c
            org_id: org_3Fz8QmW1
            user_id: usr_7Hq2LkP9
            status: active
            result: failed
            session_type: AUTOMATION
            np_type: BAP
            subscriber_url: https://buyer.example-np.in/ondc
            domain: ONDC:RET10
            version: 1.2.5
            usecase_id: GROCERY
            created_at: '2026-10-20T09:12:44Z'
            last_activity_at: '2026-10-21T08:03:10Z'
            expires_at: '2026-10-25T08:03:10Z'
            report_available: false
            flow_summary:
              - flow_id: ORDER_FLOW
                total_steps: 4
                passed_steps: 4
                failed_steps: 0
                transaction_ids: [txn_5d1e0b7f, txn_a83c92e4]
              - flow_id: CANCEL_FLOW
                total_steps: 6
                passed_steps: 2
                failed_steps: 1
                transaction_ids: [txn_0f6b3d21]
              - flow_id: RETURN_FLOW
                total_steps: 8
                passed_steps: 0
                failed_steps: 0
                transaction_ids: []
            settings:
              protocol_validation: true
              header_validation: false
              time_validation: true
              sensitive_ttl: true
              use_gateway: true
              stop_after_first_nack: true
              use_gzip: false
            settings_history:
              - changed_at: '2026-10-21T07:45:02Z'
                changed_by: usr_7Hq2LkP9
                changes:
                  - setting: use_gateway
                    previous_value: false
                    new_value: true
              - changed_at: '2026-10-20T09:20:13Z'
                changed_by: usr_7Hq2LkP9
                changes:
                  - setting: header_validation
                    previous_value: true
                    new_value: false
                  - setting: use_gzip
                    previous_value: true
                    new_value: false
              - changed_at: '2026-10-20T09:14:30Z'
                changed_by: usr_7Hq2LkP9
                changes:
                  - setting: header_validation
                    previous_value: false
                    new_value: true
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
