get:
  operationId: listOrganizationSessions
  summary: List sessions of an organization
  description: |
    Returns the **latest 100** workbench sessions of the organization (newest first by
    `created_at`), both currently **active** and **expired** (past) ones. The response is
    not paginated.

    Each item is a lightweight summary. To get a session's flow results, settings and
    settings history, call `GET /organizations/{org_id}/sessions/{session_id}`.

    A session is `active` while it can still be used in the workbench. Sessions expire
    after a period of inactivity (currently 4 days since the last activity); once expired
    they remain listed as historical records with `status: expired`.

    ### Filtering
    All filters are optional and are applied before the 100-session limit. Different
    filters are combined with AND; repeating a filter (e.g.
    `domain=ONDC:RET10&domain=ONDC:RET11`) matches ANY of the values. Text filters are
    exact, case-sensitive matches, except `q`.

    Common queries:
    - Active sessions of one user: `?status=active&user_id=usr_7Hq2LkP9`
    - Failed sessions this month: `?result=failed&created_from=2026-10-01T00:00:00Z`
    - Sessions that ran a flow: `?flow_id=ORDER_FLOW&domain=ONDC:RET10`

    `has_more: true` means more than 100 sessions matched. To look further back, narrow
    the filters or set `created_to` to the `created_at` of the oldest session returned.
  tags: [Sessions]
  parameters:
    - $ref: ../components/parameters/OrgId.yaml
    - name: q
      in: query
      required: false
      description: |
        Free-text search. Case-insensitive partial match on `session_id`,
        `subscriber_url` and `user_id`.
      schema:
        type: string
        minLength: 2
        maxLength: 100
      example: buyer.example-np
    - name: status
      in: query
      required: false
      description: Filter by session status. Omit to return both active and expired sessions.
      schema:
        $ref: ../components/schemas/SessionStatus.yaml
    - name: result
      in: query
      required: false
      description: Filter by overall session outcome. Repeat for several.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: ../components/schemas/SessionResult.yaml
      example: [failed]
    - name: user_id
      in: query
      required: false
      description: Sessions created by these users. Repeat for several.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 50
        items:
          type: string
      example: [usr_7Hq2LkP9]
    - $ref: ../components/parameters/DomainFilter.yaml
    - $ref: ../components/parameters/VersionFilter.yaml
    - $ref: ../components/parameters/UsecaseIdFilter.yaml
    - name: np_type
      in: query
      required: false
      description: Filter by network participant type.
      schema:
        $ref: ../components/schemas/NpType.yaml
    - name: session_type
      in: query
      required: false
      description: Filter by how the session is driven.
      schema:
        type: string
        enum: [AUTOMATION, MANUAL]
    - name: subscriber_url
      in: query
      required: false
      description: Sessions for these subscriber URLs (exact match). Repeat for several.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 50
        items:
          type: string
      example: [https://buyer.example-np.in/ondc]
    - name: flow_id
      in: query
      required: false
      description: Sessions that include any of these flows. Repeat for several.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 50
        items:
          type: string
      example: [ORDER_FLOW]
    - name: created_from
      in: query
      required: false
      description: Only sessions created at or after this instant (inclusive).
      schema:
        type: string
        format: date-time
      example: '2026-10-01T00:00:00Z'
    - name: created_to
      in: query
      required: false
      description: Only sessions created before this instant (exclusive). Must be after `created_from`.
      schema:
        type: string
        format: date-time
      example: '2026-11-01T00:00:00Z'
    - name: last_activity_from
      in: query
      required: false
      description: Only sessions last used at or after this instant (inclusive).
      schema:
        type: string
        format: date-time
      example: '2026-10-15T00:00:00Z'
    - name: last_activity_to
      in: query
      required: false
      description: Only sessions last used before this instant (exclusive). Must be after `last_activity_from`.
      schema:
        type: string
        format: date-time
      example: '2026-10-22T00:00:00Z'
    - $ref: ../components/parameters/RequestId.yaml
  responses:
    '200':
      description: Up to 100 sessions, newest first. Returns an empty `data` array when nothing matches.
      headers:
        X-Request-Id:
          $ref: ../components/headers/RequestId.yaml
      content:
        application/json:
          schema:
            type: object
            required: [data, has_more]
            properties:
              data:
                type: array
                maxItems: 100
                items:
                  $ref: ../components/schemas/SessionListItem.yaml
              has_more:
                type: boolean
                description: '`true` if more than 100 sessions matched and only the latest 100 are returned.'
          example:
            data:
              - session_id: sess_9b2f4e1a7c
                user_id: usr_7Hq2LkP9
                status: active
                result: failed
                session_type: AUTOMATION
                np_type: BAP
                subscriber_url: https://buyer.example-np.in/ondc
                domain: ONDC:RET10
                version: 1.2.5
                usecase_id: GROCERY
                created_at: '2026-10-20T09:12:44Z'
                last_activity_at: '2026-10-21T08:03:10Z'
              - session_id: sess_41c0d8e2aa
                user_id: usr_K2m9Xw4T
                status: expired
                result: passed
                session_type: AUTOMATION
                np_type: BPP
                subscriber_url: https://seller.example-np.in/ondc
                domain: ONDC:RET10
                version: 1.2.5
                usecase_id: GROCERY
                created_at: '2026-10-02T11:40:00Z'
                last_activity_at: '2026-10-03T16:22:51Z'
            has_more: false
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
