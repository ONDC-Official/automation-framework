title: Pagination
type: object
required: [page, limit, total_items, total_pages]
properties:
  page:
    type: integer
    minimum: 1
    description: Current page number (1-based).
  limit:
    type: integer
    minimum: 1
    description: Page size used for this response.
  total_items:
    type: integer
    minimum: 0
    description: Total number of items matching the filters, across all pages.
  total_pages:
    type: integer
    minimum: 0
    description: Total number of pages (`0` when there are no items).
