title: SettingsChange
description: One update to a session's settings. A single update can change several settings.
type: object
required: [changed_at, changed_by, changes]
properties:
  changed_at:
    type: string
    format: date-time
    description: When the update was made.
  changed_by:
    type: string
    description: '`user_id` of the user who made the update.'
  changes:
    type: array
    minItems: 1
    description: Settings whose value changed in this update.
    items:
      type: object
      required: [setting, previous_value, new_value]
      properties:
        setting:
          type: string
          description: Name of the setting, as used in `settings` (e.g. `use_gateway`).
        previous_value:
          type: boolean
        new_value:
          type: boolean
