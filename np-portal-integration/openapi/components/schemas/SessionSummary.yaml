title: SessionSummary
description: Summary of a single workbench session.
type: object
required:
  - session_id
  - org_id
  - user_id
  - status
  - result
  - session_type
  - np_type
  - subscriber_url
  - flow_summary
  - report_available
  - settings
  - settings_history
  - created_at
  - last_activity_at
  - expires_at
properties:
  session_id:
    type: string
    description: Unique session identifier.
  org_id:
    type: string
    description: Organization the session belongs to.
  user_id:
    type: string
    description: User who created the session.
  status:
    $ref: SessionStatus.yaml
  result:
    $ref: SessionResult.yaml
  session_type:
    type: string
    enum: [AUTOMATION, MANUAL]
    description: How the session is driven.
  np_type:
    $ref: NpType.yaml
  subscriber_url:
    type: string
    format: uri
    description: Subscriber URL of the network participant under test.
  domain:
    type: [string, 'null']
    description: ONDC domain, e.g. `ONDC:RET10`.
  version:
    type: [string, 'null']
    description: Protocol version, e.g. `1.2.5`.
  usecase_id:
    type: [string, 'null']
    description: Use case selected when the session was created.
  flow_summary:
    type: array
    description: Results per flow in the session. Empty if no flows are configured.
    items:
      $ref: FlowRunSummary.yaml
  settings:
    description: |
      Current settings of the session (for an expired session, the settings it had when
      it expired). `null` for sessions created before settings were recorded.
    oneOf:
      - $ref: SessionSettings.yaml
      - type: 'null'
  settings_history:
    type: array
    maxItems: 10
    description: |
      The last 10 updates to the session's settings, newest first. Empty if the settings
      were never changed after the session was created.
    items:
      $ref: SettingsChange.yaml
  report_available:
    type: boolean
    description: Whether a test report has been generated for this session.
  created_at:
    type: string
    format: date-time
    description: When the session was created.
  last_activity_at:
    type: string
    format: date-time
    description: Last time the session was used or updated.
  expires_at:
    type: [string, 'null']
    format: date-time
    description: |
      When the session will expire if there is no further activity. Each activity
      pushes this forward. `null` for expired sessions.
